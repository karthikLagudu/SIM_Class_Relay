<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class Relay | Super Intelli Machines</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Class Relay home">Class <strong>Relay</strong></a>
    {% if user %}
    <div class="account">
      <span class="account-name">{{ user.name }}</span>
      {% if csrf_token %}
      <form method="post" action="/logout">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="ghost-button">Sign out</button>
      </form>
      {% endif %}
    </div>
    {% endif %}
  </header>
  <main id="main-content" class="shell" tabindex="-1">
    {% if message %}<div class="flash" role="status">{{ message }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer"><div><span>Class Relay</span><strong>Super Intelli Machines</strong></div></footer>
</body>
</html>
