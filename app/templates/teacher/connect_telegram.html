{% extends "base.html" %}
{% block content %}
<a class="back" href="/teacher/classes/{{ class_id }}">Back to class</a>
<section class="card">
  <h1>Connect your Telegram account</h1>

  <a class="button" href="{{ link.url }}" rel="noreferrer">Open Telegram</a>
</section>
{% endblock %}
