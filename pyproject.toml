[build-system]
requires = ["setuptools>=84.2.1,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "classroom-companion"
version = "1.0.0"
description = "Class Relay by Super Intelli Machines connects classroom work and feedback across web and Telegram."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Education",
]
dependencies = [
  "fastapi>=0.162.7,<1",
  "uvicorn[standard]>=0.54,<1",
  "sqlalchemy>=2.1.8,<3",
  "pydantic-settings>=2.16.3,<3",
  "jinja2>=3.1.6,<4",
  "python-multipart>=0.0.33,<1",
  "httpx2>=2.16,<3",
  "openai>=3.50,<4",
  "itsdangerous>=2.2,<3",
  "tzdata>=2026.6",
]

[project.urls]
Repository = "https://github.com/karthikLagudu/SIM_Class_Relay"
"Demo guide" = "https://github.com/karthikLagudu/SIM_Class_Relay/blob/main/DEMO.md"

[project.optional-dependencies]
dev = ["pytest>=9.2,<10", "pytest-cov>=7.1,<8", "ruff>=0.17.5,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"] # FastAPI intentionally evaluates Depends/Form/File in route signatures.

[tool.setuptools.packages.find]
include = ["app*"]
